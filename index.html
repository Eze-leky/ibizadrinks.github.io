<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso de Bartenders</title>
    <meta name="description" content="Visitá nuestro sitio actual de Curso de Bartenders">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a0f08 0%, #2d1810 50%, #1a0f08 100%);
            color: #f5e6d3;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(circle at 20% 30%, rgba(212, 165, 116, 0.15) 0%, transparent 50%),
                              radial-gradient(circle at 80% 70%, rgba(184, 115, 51, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
            position: relative;
            z-index: 1;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .accent-line {
            width: 60px;
            height: 2px;
            background: #d4a574;
            margin: 0 auto 30px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 7vw, 3.5rem);
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 20px;
            color: #f5e6d3;
            letter-spacing: -0.02em;
        }

        h1 span {
            color: #d4a574;
            font-style: italic;
        }

        p {
            font-size: clamp(1rem, 3vw, 1.15rem);
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 40px;
            color: #c9b8a3;
            padding: 0 10px;
        }

        .btn {
            display: inline-block;
            padding: 18px 40px;
            background: #d4a574;
            color: #1a0f08;
            text-decoration: none;
            font-size: clamp(1rem, 3vw, 1.1rem);
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border-radius: 4px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(212, 165, 116, 0.3);
            border: 2px solid #d4a574;
            cursor: pointer;
            min-width: 240px;
        }

        .btn:hover {
            background: transparent;
            color: #d4a574;
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(212, 165, 116, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .footer-text {
            margin-top: 40px;
            font-size: 0.85rem;
            color: #8a7d6b;
            font-weight: 300;
        }

        @media (max-width: 480px) {
            .container {
                padding: 0 10px;
            }

            .btn {
                width: 100%;
                max-width: 320px;
                padding: 16px 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="accent-line"></div>
        <h1>Curso de <span>Bartenders</span></h1>
        <p>Visitá nuestro sitio oficial para conocer todos los detalles del curso, precios e inscripciones.</p>
        <a href="https://cursodebartenders.com.ar/" class="btn" rel="noopener">Ir al sitio oficial</a>
        <p class="footer-text">cursodebartenders.com.ar</p>
    </div>
</body>
</html>
